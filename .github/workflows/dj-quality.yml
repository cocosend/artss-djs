name: DJ Creator Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dj-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source syntax
        run: node --check creative-pack.js && node tests/creative-pack.mjs && node tests/all-sounds.cjs && node --check app.js && node --check midi-controller.js && node --check music-composer.js && node --check sw.js && node tests/audio-lifecycle.cjs && node tests/midi-controller.mjs && node tests/music-presets.cjs
      - name: Verify SOUNDLAB v8 audio engine and production script
        run: |
          node --check studio/app.js
          node --check studio/engine.js
          node --check studio/sw.js
          node --test studio/tests/engine.test.mjs
          node -e "const f=require('fs');for (const p of ['studio/index.html','studio/app.css','studio/manifest.webmanifest'])if(!f.existsSync(p))throw Error(p+' missing')"
      - name: Build production bundle
        run: npm run build
      - name: Run real-browser interaction smoke test
        run: CHROME_BIN=/usr/bin/google-chrome node tests/browser-smoke.cjs
      - name: Validate package and PWA metadata
        run: |
          node -e "for (const p of ['package.json','manifest.webmanifest']) { const d=JSON.parse(require('node:fs').readFileSync(p,'utf8')); if (!d.name) throw Error(p+' missing name') }"
      - name: Ensure one audio runtime and stable entrypoint
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f sw.js
          test -d icons
          test -z "$(find . -path './.git' -prune -o -type f \( -iname '*backup*.js' -o -iname '*old*.js' \) -print)"

  webkit-quality:
    name: iOS WebKit mobile interaction
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned browser runner
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Install Safari-compatible WebKit
        run: npx playwright install --with-deps webkit
      - name: Prepare deployable static preview
        run: npm run build
      - name: Exercise real WebKit audio and touch interactions
        run: node tests/ios-webkit-smoke.cjs
      - name: Verify SOUNDLAB mobile recording and WAV in WebKit
        run: node studio/tests/webkit-smoke.cjs
