name: ARTSS LIVE 16 Performance Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artss-live16-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-and-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check 8-pad audio, migrated projects and 16-step release
        run: npm test && npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install browser smoke runner
        run: python3 -m pip install playwright==1.55.0
      - name: Validate realtime audio, transport, record, WAV and saved sessions
        run: CHROME_BIN=/usr/bin/google-chrome python3 tests/browser-qa.py chromium
  ios-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare static PWA
        run: npm test && npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install WebKit
        run: python3 -m pip install playwright==1.55.0 && python3 -m playwright install --with-deps webkit
      - name: Validate iOS touch audio, overdub, take and WAV
        run: python3 tests/browser-qa.py webkit