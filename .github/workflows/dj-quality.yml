name: ARTSS DJ Creator 20.1 - Auto Groove + Native DSP + iOS QA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typecheck-unit-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm run compile && npm run build && npm test
      - run: g++ -std=c++20 -O2 -Wall -Wextra -pedantic native/core/AudioCore.cpp native/core/test.cpp -o /tmp/artss-audio-test && /tmp/artss-audio-test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install playwright==1.55.0
      - run: CHROME_BIN=/usr/bin/google-chrome python tests/browser-qa.py chromium
  ios-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run compile && npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps webkit
      - run: python tests/browser-qa.py webkit