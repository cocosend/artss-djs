name: ARTSS LIVE 14 High-Fidelity Samples Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify DSP fidelity, existing banks and canonical PWA build
        run: npm test && npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install mobile browser test runner
        run: python3 -m pip install playwright==1.55.0
      - name: Verify track import, loop overdub, pause, WAV and takes in Chromium
        run: CHROME_BIN=/usr/bin/google-chrome python3 tests/production-qa.py chromium

  ios-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare canonical PWA
        run: npm test && npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install iOS WebKit browser and dependencies
        run: python3 -m pip install playwright==1.55.0 && python3 -m playwright install --with-deps webkit
      - name: Verify iPhone slicing, overdub, pause, takes and WAV in WebKit
        run: python3 tests/production-qa.py webkit