name: Native iOS
on:
  workflow_dispatch:
  pull_request:
    paths: ['native/**', '.github/workflows/ios-native.yml']
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/ios-native.yml']
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Install native dependencies (retry upstream Skia 504 errors)
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund; then
              exit 0
            fi
            echo "npm installation failed (attempt $attempt/3); retrying transient Skia download"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 12))
          done
      - run: npm run verify
      - run: bundle install && bundle exec pod install --project-directory=ios
      - name: Archive iPhone app without signing
        run: xcodebuild -workspace ios/ARTSSNative.xcworkspace -scheme ARTSSNative -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/ARTSS.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload build/ipa
          cp -R build/ARTSS.xcarchive/Products/Applications/ARTSSNative.app build/package/Payload/
          (cd build/package && zip -qry ../ipa/ARTSS-DJS-FIX37-UNSIGNED.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ARTSS-DJS-FIX37-UNSIGNED-${{ github.run_number }}
          path: native/build/ipa/ARTSS-DJS-FIX37-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 7
