name: Native iOS
on:
  workflow_dispatch:
  pull_request:
    paths: ['native/**', '.github/workflows/ios-native.yml']
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/ios-native.yml']
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: bundle install && bundle exec pod install --project-directory=ios
      - name: Compile for iOS simulator
        run: xcodebuild -workspace ios/ARTSSNative.xcworkspace -scheme ARTSSNative -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Archive iPhone app without signing
        run: xcodebuild -workspace ios/ARTSSNative.xcworkspace -scheme ARTSSNative -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/ARTSS.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload build/ipa
          cp -R build/ARTSS.xcarchive/Products/Applications/ARTSSNative.app build/package/Payload/
          (cd build/package && zip -qry ../ipa/ARTSS-UNSIGNED.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ARTSS-UNSIGNED-${{ github.run_number }}
          path: native/build/ipa/ARTSS-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 7
