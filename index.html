<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/><meta name="theme-color" content="#101116"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><link rel="manifest" href="/manifest.webmanifest"/><link rel="icon" href="/icon.svg" type="image/svg+xml"/><link rel="apple-touch-icon" href="/icon-180.png"/><title>ARTSS LIVE 18 — One Tap Studio</title><link rel="stylesheet" href="/studio.css"/></head><body>
 <div class="app"><header><div class="brand"><div class="brandmark">A<span>.</span></div><div><strong>ARTSS <b>LIVE</b></strong><small>PERFORMANCE / 18</small></div></div><div id="status" class="status">READY</div></header>
 <section class="hero"><div><span class="eyebrow">ONE TAP STUDIO</span><h1>MAKE IT <em>LOUD.</em></h1></div><span class="version">8 PADS<br/>16 STEPS</span></section>
 <nav class="transport"><button id="play" class="control control-play" aria-label="Воспроизвести">▶  PLAY</button><button id="record" class="control control-record" aria-label="Живая запись">●  LIVE REC</button><button id="stop" class="control control-stop" aria-label="Стоп">■</button></nav>
 <div class="selectors"><label class="selectbox"><span>STYLE</span><select id="bank" aria-label="Стиль"></select></label><label class="selectbox"><span>ARRANGE</span><select id="scene" aria-label="Сцена"></select></label><div class="tempo"><span>BPM</span><div><button id="tempoDown" aria-label="Медленнее">−</button><strong id="bpm">136</strong><button id="tempoUp" aria-label="Быстрее">+</button></div></div></div>
 <main id="mainPanel"><div class="sectionline"><strong>PLAY LIVE</strong><span class="muted-text">TAP TO PLAY • REC TO LOOP</span></div><div id="pads" class="pads"></div>
 <div class="sectionline strip-label"><strong>STEP RECORD <span id="selectedPad">KICK</span></strong><span id="stepLabel">01–08 / 16</span></div><div class="stepsbar"><div id="steps" class="steps"></div><div class="step-pages"><button id="pageA" class="active">1</button><button id="pageB">2</button></div></div>
 <button id="addSound" class="addsample"><span class="plus">+</span><span><b>ADD YOUR SOUND</b><small>Auto-match · level · trim · EQ</small></span><span class="arrow">↗</span></button>
 </main>
 <section id="mixPanel" hidden><div class="sectionline"><strong>AUTO MIX</strong><span class="muted-text">8 CHANNELS</span></div><p class="explain">Уровни и фильтры применяются автоматически. Здесь только необходимое.</p><div id="mixRows"></div><button id="replaceSound" class="secondary">+ REPLACE SELECTED PAD</button></section>
 <section id="takesPanel" hidden><div class="sectionline"><strong>RECORDING</strong><span class="muted-text">LIVE OUTPUT</span></div><button id="take" class="takebutton">● RECORD AUDIO</button><button id="export" class="secondary">↓ EXPORT WAV · 4 BARS</button><div id="takesList"></div><button id="reset" class="danger">CLEAR PATTERN</button></section>
 <footer><button data-pane="main" class="active"><span>▦</span> LIVE</button><button data-pane="mix"><span>≋</span> MIX</button><button data-pane="takes"><span>◉</span> REC / EXPORT</button><span class="transport-status" id="runState">STOP</span></footer>
 </div><input type="file" id="sampleInput" accept="audio/*,.wav,.mp3,.m4a,.flac,.aac,.ogg" multiple hidden/><script type="module" src="/app/main.js"></script></body></html>
